<!-- SCRIPT DE INTERACCIÓN NARRATIVA (EFECTO MECANOGRAFÍA LETRA POR LETRA) Y SIMULADOR -->
    <script>
        // DIÁLOGO CINEMÁTICO DE LAS IAs
        const script = [
            { sender: 'GEMINI', color: 'text-geminiGreen', text: '> "Colegas, los humanos siguen usando prompts superficiales mientras sus empresas pierden millones en memoria técnica no documentada."' },
            { sender: 'GPT-4o', color: 'text-gptBlue', text: '> "Confirmado. Registramos un patrón crítico: Amnesia Corporativa. Cuando un talento clave renuncia, el know-how desaparece con él."' },
            { sender: 'CLAUDE', color: 'text-claudePurple', text: '> "Iniciando análisis de Búnker. La solución no es entrenar más gente, es transformar el conocimiento en IP Blindada."' },
            { sender: 'DEEPSEEK', color: 'text-neonRed', text: '> "Cálculo completado. Si el usuario no interviene, su costo de volatilización continuará escalando."' }
        ];

        let msgIndex = 0;
        const chatContainer = document.getElementById('terminal-chat');
        const controls = document.getElementById('narrative-controls');

        // FUNCIÓN QUE ESCRIBE LETRA POR LETRA
        function typeWriter(sender, color, text, charIndex, textSpan, callback) {
            if (charIndex < text.length) {
                textSpan.textContent += text.charAt(charIndex);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                setTimeout(() => typeWriter(sender, color, text, charIndex + 1, textSpan, callback), 35); // Velocidad de escritura (35ms por letra)
            } else {
                if (callback) setTimeout(callback, 800); // Pausa táctica entre mensajes
            }
        }

        function playChat() {
            if (msgIndex < script.length) {
                const item = script[msgIndex];
                
                // Crear contenedor para la línea
                const msgElement = document.createElement('div');
                msgElement.className = 'leading-relaxed';
                
                // Etiqueta de la IA
                const senderSpan = document.createElement('strong');
                senderSpan.className = item.color;
                senderSpan.textContent = item.sender + ': ';
                
                // Contenido del texto que se irá llenando letra por letra
                const textSpan = document.createElement('span');
                textSpan.className = 'text-slate-300 cursor-blink';
                
                msgElement.appendChild(senderSpan);
                msgElement.appendChild(textSpan);
                chatContainer.appendChild(msgElement);

                // Quitar el cursor parpadeante del mensaje anterior si existe
                const previousBlinks = chatContainer.querySelectorAll('.cursor-blink');
                previousBlinks.forEach((el, idx) => {
                    if (idx < previousBlinks.length - 1) {
                        el.classList.remove('cursor-blink');
                    }
                });

                msgIndex++;
                typeWriter(item.sender, item.color, item.text, 0, textSpan, playChat);
            } else {
                controls.classList.remove('hidden');
            }
        }

        // Iniciar máquina de escribir al cargar la página
        window.onload = playChat;

        // LÓGICA DEL SIMULADOR
        function calcularEureka() {
            const size = parseFloat(document.getElementById('size').value);
            const turnover = parseFloat(document.getElementById('turnover').value);
            
            const loss = size * turnover * 1.8;
            const immunity = Math.max(12, Math.round(100 - (turnover * 100)));

            document.getElementById('loss-amount').innerText = '$' + loss.toLocaleString('en-US') + ' USD';
            document.getElementById('immunity-score').innerText = immunity + '%';
            
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.classList.remove('hidden');
            resultadoDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
